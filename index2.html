<body>
    <div id="show"></div>
    <button id="start"> start</button>
    <script>
        let show = document.querySelector("#show")
        let btn = document.querySelector("#start")
        
      
        btn.addEventListener("click" , ()=>{
            let number  = 10;
        let id = setInterval(()=>{
         if(number >0){
            number--
            show.innerHTML = number
         }
        },1000)
        })
    </script>
</body>
